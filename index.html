<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LiveBet">
<meta name="theme-color" content="#0e0f0d">
<meta name="robots" content="noindex,nofollow">
<title>LiveBet</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f3f3ef;--surface:#ffffff;--surface-2:#ecebe6;--line:#e1e0da;--text:#141412;--text-2:#55554f;--text-3:#8b8a83;
  --accent:#1f9d55;--accent-soft:#dcf2e5;--home:#2a78d6;--draw:#9a9993;--away:#eb6834;--bad:#c8402a;--warn:#b7791f;
  --tab:rgba(255,255,255,.86);--seg-on:#ffffff;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
  --r:16px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e0f0d;--surface:#181917;--surface-2:#222320;--line:#2c2d29;--text:#f4f4ef;--text-2:#b9b8ae;--text-3:#7f7e76;
  --accent:#3ccf7d;--accent-soft:#16301f;--home:#4b93ea;--draw:#8f8e86;--away:#f07a49;--bad:#ef6a52;--warn:#e0a63c;
  --tab:rgba(24,25,23,.86);--seg-on:#3b3c38;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0f0d;--surface:#181917;--surface-2:#222320;--line:#2c2d29;--text:#f4f4ef;--text-2:#b9b8ae;--text-3:#7f7e76;
  --accent:#3ccf7d;--accent-soft:#16301f;--home:#4b93ea;--draw:#8f8e86;--away:#f07a49;--bad:#ef6a52;--warn:#e0a63c;--tab:rgba(24,25,23,.86);--seg-on:#3b3c38;--shadow:none;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(72px + var(--safe-b));overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(var(--safe-t) + 10px) 16px 8px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-size:30px;line-height:1.1;margin:0;letter-spacing:-.02em;font-weight:800}
.stamp{font-size:12px;color:var(--text-3);text-align:right}
.stamp.old{color:var(--warn);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 2px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;background:var(--surface-2);color:var(--text-2);font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--text);color:var(--bg)}
.chip small{font-weight:500;opacity:.7;margin-left:4px}
.search{margin-top:10px;width:100%;padding:9px 12px;border-radius:12px;border:0;background:var(--surface-2);color:var(--text);font:inherit;font-size:16px}
.seg{display:flex;background:var(--surface-2);border-radius:11px;padding:3px;margin-top:10px}
.seg button{flex:1;padding:7px 0;border-radius:9px;font-weight:600;font-size:14px;color:var(--text-2)}
.seg button.on{background:var(--seg-on);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15)}
main{padding:4px 16px 16px}
.gh{font-size:13px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;margin:18px 4px 8px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.row:first-child{border-top:0}
.row:active{background:var(--surface-2)}
.t{width:44px;flex:none;font-size:13px;color:var(--text-2);font-weight:600}
.teams{flex:1;min-width:0}
.teams div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.teams .fav{font-weight:700}
.sub{font-size:12px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p3{display:grid;grid-template-columns:repeat(3,38px);gap:4px;text-align:center;font-size:13px;flex:none}
.p3 span{padding:5px 0;border-radius:8px;background:var(--surface-2);color:var(--text-2)}
.p3 span.max{background:var(--accent-soft);color:var(--accent);font-weight:700}
.p3h{display:grid;grid-template-columns:repeat(3,38px);gap:4px;text-align:center;font-size:11px;color:var(--text-3);font-weight:600}
.pp{flex:none;text-align:right;min-width:62px}
.pp b{font-size:17px}
.pp div{font-size:12px;color:var(--text-3)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--text-2);vertical-align:1px}
.pill.w{background:rgba(224,166,60,.18);color:var(--warn)}
.pill.g{background:var(--accent-soft);color:var(--accent)}
.bar2{height:6px;border-radius:3px;overflow:hidden;display:flex;background:var(--surface-2);margin-top:6px}
.bar2 i{display:block;height:100%}
.empty{padding:40px 20px;text-align:center;color:var(--text-3)}
.note{font-size:12.5px;color:var(--text-3);padding:12px 4px;line-height:1.45}
.sel{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.sel:first-child{border-top:0}
.sel .m{flex:1;min-width:0}
.sel .m b{display:block}
.ev{font-size:12px;font-weight:700}
.ev.pos{color:var(--accent)}.ev.neg{color:var(--text-3)}
.ring{--p:0;width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12.5px;font-weight:800;
  background:radial-gradient(closest-side,var(--surface) 76%,transparent 78%),conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-2) 0)}
.slider{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:14px;color:var(--text-2)}
.slider input{flex:1;accent-color:var(--accent)}
.slider b{color:var(--text);min-width:44px;text-align:right}
.track{display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:var(--r);padding:12px 14px;margin-top:12px;box-shadow:var(--shadow);font-size:13px;color:var(--text-2)}
.track b{color:var(--text)}
.czb{display:flex;gap:8px}.czb button{flex:1;padding:9px 0 7px;border-radius:12px;background:var(--surface-2);font-weight:800;font-size:18px;display:flex;flex-direction:column;align-items:center;gap:1px}
.czb button small{font-size:11px;font-weight:600;color:var(--text-3)}.czb button.on{background:var(--accent);color:#fff}.czb button.on small{color:rgba(255,255,255,.85)}
.czb button:disabled{opacity:.5}
/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--tab);backdrop-filter:saturate(1.8) blur(18px);-webkit-backdrop-filter:saturate(1.8) blur(18px);
  border-top:1px solid var(--line);padding:6px 8px calc(6px + var(--safe-b))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--text-3);padding:4px 0}
nav button svg{width:26px;height:26px}
nav button.on{color:var(--accent)}
/* hoja de detalle */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92vh;background:var(--bg);border-radius:20px 20px 0 0;transform:translateY(102%);
  transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-bottom:var(--safe-b)}
.open .sheet-bg{opacity:1;pointer-events:auto}.open .sheet{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
.sh{display:flex;align-items:flex-start;gap:10px;padding:10px 16px 6px}
.sh h2{font-size:20px;margin:0;flex:1;line-height:1.2}
.x{width:30px;height:30px;border-radius:50%;background:var(--surface-2);color:var(--text-2);font-size:17px;font-weight:700;flex:none}
.sb{overflow-y:auto;padding:4px 16px 24px;-webkit-overflow-scrolling:touch}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.kp>div{background:var(--surface);border-radius:14px;padding:10px;box-shadow:var(--shadow)}
.kp .l{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kp .v{font-size:22px;font-weight:800;margin-top:2px}
.kp .s{font-size:12px;color:var(--text-2)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:9px 14px;border-top:1px solid var(--line);text-align:right}
th{font-size:12px;color:var(--text-3);font-weight:600;border-top:0}
td:first-child,th:first-child{text-align:left}
tr:first-child td{border-top:0}
.hb{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--line);font-size:14px}
.hb:first-child{border-top:0}
.hb .k{width:76px;font-weight:700}
.hb .tr{flex:1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--accent);border-radius:4px}
.hb .v{width:52px;text-align:right}
.hb .o{width:44px;text-align:right;color:var(--text-3);font-size:12px}
.loading{display:grid;place-items:center;height:60vh;color:var(--text-3)}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="main"><div class="loading">Cargando…</div></main>
<nav id="nav">
  <button data-v="fut" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 7.5l4.2 3-1.6 5h-5.2l-1.6-5z"/><path d="M12 3v4.5M16.2 10.5l4.4-1.4M14.6 15.5l2.7 3.8M9.4 15.5l-2.7 3.8M7.8 10.5L3.4 9.1"/></svg>Fútbol</button>
  <button data-v="pad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><ellipse cx="10" cy="9" rx="6" ry="6.5"/><path d="M14.2 13.6l5.6 6.4"/><circle cx="8" cy="7.5" r=".6" fill="currentColor"/><circle cx="11.5" cy="7" r=".6" fill="currentColor"/><circle cx="9.5" cy="10.5" r=".6" fill="currentColor"/><circle cx="19" cy="5" r="2"/></svg>Pádel</button>
  <button data-v="sel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 12.5l4.5 4.5L20 6.5"/></svg>Selecciones</button>
  <button data-v="cz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Corazonadas</button>
</nav>
<div id="sheetwrap"><div class="sheet-bg" id="sbg"></div><div class="sheet" id="sheet"><div class="grab"></div><div class="sh"><h2 id="stitle"></h2><button class="x" id="sx" aria-label="Cerrar">×</button></div><div class="sb" id="sbody"></div></div></div>
<script src="padel_core.js"></script>
<script src="markets_extra.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pc=(x,d=0)=>(x==null||isNaN(x))?'–':(100*x).toFixed(d).replace('.',',')+' %';
const fo=p=>p>0?(1/p).toFixed(2).replace('.',','):'–';
const o2=x=>x?(+x).toFixed(2).replace('.',','):'–';
let ST={v:'fut',day:null,q:'',pday:null,scope:'fut',thr:80,grp:'all',rng:'7'};
try{Object.assign(ST,JSON.parse(localStorage.getItem('lb_state')||'{}'),{q:''})}catch(e){}
const save=()=>{try{localStorage.setItem('lb_state',JSON.stringify(ST))}catch(e){}};
let D=null,LAST=0;

// ---------- fechas
const tzFmt=new Intl.DateTimeFormat('es-ES',{hour:'2-digit',minute:'2-digit'});
const dayKey=iso=>{const d=new Date(iso);return isNaN(d)?String(iso).slice(0,10):d.toLocaleDateString('sv-SE')};
const todayKey=()=>new Date().toLocaleDateString('sv-SE');
function dayLabel(k){const t=todayKey(),d=new Date(k+'T12:00:00'),diff=Math.round((d-new Date(t+'T12:00:00'))/864e5);
  if(diff===0)return 'Hoy';if(diff===1)return 'Mañana';if(diff===-1)return 'Ayer';
  return d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric'}).replace('.','')}
const hm=iso=>{const d=new Date(iso);return isNaN(d)||String(iso).length<=10?'':tzFmt.format(d)};
function ago(iso){const h=(Date.now()-new Date(iso))/36e5;if(!(h>=0))return '';if(h<1)return 'hace '+Math.max(1,Math.round(h*60))+' min';if(h<36)return 'hace '+Math.round(h)+' h';return 'hace '+Math.round(h/24)+' días'}

// ---------- fútbol: distribución completa de marcadores
function pois(l,k){let p=Math.exp(-l);for(let i=1;i<=k;i++)p*=l/i;return p}
const FC=new Map();
function fdist(m){if(FC.has(m.id))return FC.get(m.id);
  const g=m.g||[],tot=g.reduce((a,b)=>a+b,0)||1,cells=[];
  for(let h=0;h<7;h++)for(let a=0;a<7;a++)cells.push([h,a,g[h*7+a]/tot]);
  const other=(g[49]||0)/tot;
  if(other>0&&m.lh>0&&m.la>0){const ext=[];let s=0;for(let h=0;h<=12;h++)for(let a=0;a<=12;a++){if(h<7&&a<7)continue;const w=pois(m.lh,h)*pois(m.la,a);ext.push([h,a,w]);s+=w}
    ext.forEach(e=>cells.push([e[0],e[1],other*e[2]/s]))}
  const P=f=>cells.reduce((acc,[h,a,p])=>acc+(f(h,a)?p:0),0);
  const r={cells,H:P((h,a)=>h>a),X:P((h,a)=>h===a),A:P((h,a)=>h<a),btts:P((h,a)=>h>0&&a>0),
    over:[0.5,1.5,2.5,3.5,4.5].map(L=>[L,P((h,a)=>h+a>L)]),
    top:cells.filter(c=>c[0]<7&&c[1]<7).sort((x,y)=>y[2]-x[2]).slice(0,6)};
  FC.set(m.id,r);return r}

// ---------- cabecera y navegación
function stampHtml(){const g=D.football.generated_at,h=(Date.now()-new Date(g))/36e5;
  return `<div class="stamp ${h>30?'old':''}">Datos ${ago(g)}${h>30?'<br>sin actualizar':''}</div>`}
function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===ST.v));
  if(!D)return;({fut:futView,pad:padView,sel:selView,cz:czView})[ST.v]();save()}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;ST.v=b.dataset.v;scrollTo(0,0);render()};

// ---------- pestaña Fútbol
function futView(){
  const now=Date.now(),M=D.football.matches.filter(m=>new Date(m.ko)>now-2.5*36e5);
  const days=[...new Set(M.map(m=>dayKey(m.ko)))].sort();
  if(!days.includes(ST.day))ST.day=days[0]||null;
  const cnt=k=>M.filter(m=>dayKey(m.ko)===k).length;
  $('#hdr').innerHTML=`<div class="top"><h1>Fútbol</h1>${stampHtml()}</div>
    <div class="chips" id="days">${days.map(k=>`<button class="chip ${k===ST.day?'on':''}" data-k="${k}">${dayLabel(k)}<small>${cnt(k)}</small></button>`).join('')}</div>
    <input class="search" id="q" type="search" placeholder="Buscar equipo o competición" value="${esc(ST.q)}" autocomplete="off">`;
  $('#days').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;ST.day=b.dataset.k;futList(M)};
  $('#q').oninput=e=>{ST.q=e.target.value;futList(M)};
  futList(M);
  const on=$('#days .chip.on');if(on)on.scrollIntoView({inline:'center',block:'nearest'})}
function futList(M){
  document.querySelectorAll('#days .chip').forEach(b=>b.classList.toggle('on',b.dataset.k===ST.day));
  const q=ST.q.trim().toLowerCase();
  const L=M.filter(m=>q?(m.home+' '+m.away+' '+m.comp).toLowerCase().includes(q):dayKey(m.ko)===ST.day);
  if(!L.length){$('#main').innerHTML='<div class="empty">No hay partidos.</div>';return}
  const by={};L.forEach(m=>(by[q?dayLabel(dayKey(m.ko))+' · '+m.comp:m.comp]=by[q?dayLabel(dayKey(m.ko))+' · '+m.comp:m.comp]||[]).push(m));
  $('#main').innerHTML=Object.entries(by).map(([c,ms])=>`<div class="gh">${esc(c)}</div><div class="card">${ms.map(m=>{const d=fdist(m),mx=Math.max(d.H,d.X,d.A);
    return `<button class="row" data-id="${esc(m.id)}"><div class="t num">${hm(m.ko)}</div>
      <div class="teams"><div class="${d.H===mx?'fav':''}">${esc(m.home)}</div><div class="${d.A===mx?'fav':''}">${esc(m.away)}</div>
      <div class="sub">${m.rel&&m.rel!=='fiable'?`<span class="pill w">${esc(m.rel.replace('_',' '))}</span> `:''}${d.top[0][0]}-${d.top[0][1]} · ${pc(d.top[0][2])}</div></div>
      <div><div class="p3h"><span>1</span><span>X</span><span>2</span></div><div class="p3 num">${[d.H,d.X,d.A].map(p=>`<span class="${p===mx?'max':''}">${Math.round(p*100)}</span>`).join('')}</div></div></button>`}).join('')}</div>`).join('')
    +`<div class="note">Porcentajes del modelo (1 = local, X = empate, 2 = visitante). Toca un partido para ver marcadores y mercados.</div>`;
  $('#main').onclick=e=>{const r=e.target.closest('.row');if(r)futDetail(D.football.matches.find(m=>m.id===r.dataset.id))}}
function futDetail(m){const d=fdist(m),k=m.mk;
  const kp=(l,p,o)=>`<div><div class="l">${l}</div><div class="v num">${pc(p)}</div><div class="s num">justa ${fo(p)}${o?` · casa <b>${o2(o)}</b>`:''}</div></div>`;
  const ou=d.over.map(([L,p])=>`<tr><td>${String(L).replace('.',',')}</td><td class="num">${pc(1-p,1)}</td><td class="num">${fo(1-p)}</td><td class="num">${pc(p,1)}</td><td class="num">${fo(p)}</td></tr>`).join('');
  const ouMk=k&&k.ou?`<div class="note" style="padding-top:6px">Cuota de la casa más/menos 2,5: ${o2(k.ou[0])} / ${o2(k.ou[1])}</div>`:'';
  const mx=d.top[0][2];
  openSheet(`${esc(m.home)} – ${esc(m.away)}<div class="sub" style="font-size:13px;font-weight:500">${esc(m.comp)} · ${dayLabel(dayKey(m.ko))} ${hm(m.ko)}</div>`,
   `<div class="kp">${kp('1 · '+esc(m.home),d.H,k&&k.odds&&k.odds[0])}${kp('X · Empate',d.X,k&&k.odds&&k.odds[1])}${kp('2 · '+esc(m.away),d.A,k&&k.odds&&k.odds[2])}</div>
   ${k?`<div class="note" style="padding-bottom:0">Cuotas de ${esc(k.book||'la casa')}. «Justa» = 1 ÷ probabilidad del modelo.</div>`:''}
   ${czBlock(m)}
   <div class="gh">Marcadores más probables</div><div class="card">${d.top.map(([h,a,p])=>`<div class="hb"><div class="k num">${h} – ${a}</div><div class="tr"><i style="width:${p/mx*100}%"></i></div><div class="v num">${pc(p,1)}</div><div class="o num">${fo(p)}</div></div>`).join('')}</div>
   <div class="gh">Goles</div><div class="card"><table><tr><th>Línea</th><th>Menos</th><th>Justa</th><th>Más</th><th>Justa</th></tr>${ou}</table></div>${ouMk}
   <div class="gh">Otros</div><div class="card"><table>
     <tr><td>Ambos marcan: sí</td><td class="num">${pc(d.btts,1)}</td><td class="num">${fo(d.btts)}</td></tr>
     <tr><td>Ambos marcan: no</td><td class="num">${pc(1-d.btts,1)}</td><td class="num">${fo(1-d.btts)}</td></tr>
     <tr><td>Doble oportunidad 1X</td><td class="num">${pc(d.H+d.X,1)}</td><td class="num">${fo(d.H+d.X)}</td></tr>

async function encryptJson(obj,pw){const te=new TextEncoder(),salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt']);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(JSON.stringify(obj))));
  const out=new Uint8Array(31+ct.length);out.set([76,66,49]);out.set(salt,3);out.set(iv,19);out.set(ct,31);
  let s='';for(let i=0;i<out.length;i+=8192)s+=String.fromCharCode.apply(null,out.subarray(i,i+8192));return btoa(s)}

  const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  let pt;try{pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct)}catch(e){const er=new Error('Contraseña incorrecta');er.bad=1;throw er}
  return JSON.parse(await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text())}
function askPw(msg){$('#nav').style.display='none';
  $('#hdr').innerHTML='<div class="top"><h1>LiveBet</h1></div>';
  $('#main').innerHTML=`<form id="pwf" style="max-width:420px;margin:40px auto 0;text-align:center">
    <img src="icon-192.png" alt="" style="width:76px;height:76px;border-radius:18px">
    <p style="color:var(--text-2);margin:18px 0 14px">Introduce la contraseña de tu app.<br><span style="font-size:13px;color:var(--text-3)">Está en el archivo MovilClave.txt de tu PC. Solo te la pedirá una vez.</span></p>
    <input id="pw" class="search" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Contraseña" style="text-align:center">
    ${msg?`<div style="color:var(--bad);font-size:14px;margin-top:10px">${esc(msg)}</div>`:''}
    <button type="submit" style="margin-top:14px;width:100%;padding:12px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:16px">Entrar</button></form>`;
  $('#pwf').onsubmit=async e=>{e.preventDefault();const v=$('#pw').value.trim();if(!v)return;$('#pwf button').textContent='Abriendo…';setPw(v);try{await unlock()}catch(er){askPw(er.message)}}}
async function unlock(){const pw=getPw();if(!pw)return askPw();
  try{D=await decryptData(BUF,pw)}catch(e){if(e.bad){setPw('');return askPw('Contraseña incorrecta')}throw e}
  $('#nav').style.display='';LAST=Date.now();FC.clear();PCACHE.clear();render()}
async function load(){
  try{const r=await fetch('data.enc?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(r.status);BUF=await r.arrayBuffer();await unlock()}
  catch(e){if(!D){$('#hdr').innerHTML='<div class="top"><h1>LiveBet</h1></div>';$('#main').innerHTML=`<div class="empty">No se pudieron cargar los datos (${esc(e.message)}). Comprueba la conexión y vuelve a abrir.</div>`}}}
load();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-LAST>10*6e4)load()});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
